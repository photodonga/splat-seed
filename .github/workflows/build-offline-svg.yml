name: Assemble offline SVG standalone
on:
  push:
    branches: [feature/local-original-svg-art-20261101]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/local-original-svg-art-20261101
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build single HTML with 42 embedded SVG assets
        run: node tools/bundle.mjs app.html dist/app-standalone.html engine/murmur3.mjs engine/xorshift128.mjs engine/shellout.mjs engine/npln-id.mjs engine/candidates.mjs engine/tracker.mjs engine/plan.mjs
      - name: Commit reproducible distribution to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- dist/app-standalone.html; then
            git add dist/app-standalone.html
            git commit -m "build: embed 42 SVG assets into standalone HTML"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
