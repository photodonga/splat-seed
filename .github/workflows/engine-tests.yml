name: Shell-Out engine
on:
  pull_request:
  push:
    branches: [engine/shellout-xorshift128]
jobs:
  engine-tests:
    name: engine-tests (unit, parity, synthetic round trips, validator meta-tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
  game-validation:
    name: game-validation (real-game records; FAILS until verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # preregistration order is read from git history
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Predict unseen real-game pulls and verify jackpot rules
        run: node validation/run-game-validation.mjs fixtures/real-game
