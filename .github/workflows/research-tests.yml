name: Independent seed research tests
on:
  pull_request:
  push:
    branches: [research/independent-seed-engine]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reversible RNG math (not actual capsule prediction)
        run: node --test tests/*.test.mjs
